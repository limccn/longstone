name: lockfile-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep these in sync with ci/lockfiles/README.md. They describe the inputs
  # the committed ledger was generated from, not the current default branches.
  LONGSTONE_UI_SHA: "28655ec48baf7e6b35f4f377bccc8f51ce4010e4"
  HISAISHI_SHA: "7c8c58ee250e4f85e207d7317cb545da6fc024ce"
  MENHIR_SHA: "cf08e105c526e2cdf3438854cc3cf3825ed3d4d3"
  LONGSTONE_SURFACE_SHA: "5dc5e3b0971187803b355e211a807d15b1fda584"

jobs:
  longstone-ui-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout longstone ledger
        uses: actions/checkout@v4
        with:
          path: ledger

      - name: Checkout longstone-ui
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone-ui
          ref: ${{ env.LONGSTONE_UI_SHA }}
          token: ${{ github.token }}
          path: workspace/app

      - name: Checkout menhir
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          ref: ${{ env.MENHIR_SHA }}
          token: ${{ github.token }}
          path: workspace/menhir

      - name: Checkout longstone-surface
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone-surface
          ref: ${{ env.LONGSTONE_SURFACE_SHA }}
          token: ${{ github.token }}
          path: workspace/longstone-surface

      - name: Assemble workspace
        working-directory: workspace
        run: |
          printf 'packages:\n  - "app"\n  - "longstone-surface"\n  - "menhir/ts"\nallowBuilds:\n  "@reown/appkit": true\n  "esbuild": true\naudit:\n  ignore:\n    - "GHSA-mrhx-c7xc-m3w5"\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        working-directory: workspace
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Compare with ledger
        working-directory: workspace
        run: |
          if cmp -s ../ledger/ci/lockfiles/longstone-ui-deploy.yaml pnpm-lock.yaml; then
            echo "Ledger matches the regenerated lockfile."
            exit 0
          fi
          diff -u ../ledger/ci/lockfiles/longstone-ui-deploy.yaml pnpm-lock.yaml || true
          echo "::error::ci/lockfiles/longstone-ui-deploy.yaml is out of date; regenerate it and update the input SHAs"
          exit 1

  hisaishi-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout longstone ledger
        uses: actions/checkout@v4
        with:
          path: ledger

      - name: Checkout hisaishi
        uses: actions/checkout@v4
        with:
          repository: limccn/hisaishi
          ref: ${{ env.HISAISHI_SHA }}
          token: ${{ github.token }}
          path: workspace/hisaishi

      - name: Checkout menhir
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          ref: ${{ env.MENHIR_SHA }}
          token: ${{ github.token }}
          path: workspace/menhir

      - name: Assemble workspace
        working-directory: workspace
        run: |
          printf 'packages:\n  - "menhir/ts"\n  - "hisaishi"\nallowBuilds:\n  "esbuild": true\n  "sharp": true\n  "workerd": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        working-directory: workspace
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Compare with ledger
        working-directory: workspace
        run: |
          if cmp -s ../ledger/ci/lockfiles/hisaishi-ci.yaml pnpm-lock.yaml; then
            echo "Ledger matches the regenerated lockfile."
            exit 0
          fi
          diff -u ../ledger/ci/lockfiles/hisaishi-ci.yaml pnpm-lock.yaml || true
          echo "::error::ci/lockfiles/hisaishi-ci.yaml is out of date; regenerate it and update the input SHAs"
          exit 1

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# longstone imports both `@limccn/menhir-core` and `@limccn/hisaishi-gateway` as
# `workspace:*`; its end-to-end test also drives the real contract from the
# menhir repo on a local Hardhat node.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/longstone
      - uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir
      - uses: actions/checkout@v4
        with:
          repository: limccn/hisaishi
          token: ${{ secrets.HISAISHI_REPO_TOKEN || github.token }}
          path: workspace/hisaishi

      - name: Assemble workspace
        working-directory: workspace
        run: |
          printf 'packages:\n  - "menhir/ts"\n  - "menhir/contracts"\n  - "hisaishi"\n  - "longstone"\nallowBuilds:\n  "esbuild": true\n  "sharp": true\n  "workerd": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # L-6 exception: assembled workspace cannot use a frozen lockfile.
      # See https://github.com/limccn/longstone/blob/main/docs/supply-chain.md
      - run: pnpm install --no-frozen-lockfile
        working-directory: workspace

      - run: pnpm --filter @limccn/menhir-core build
        working-directory: workspace
      - run: pnpm --filter @limccn/hisaishi-gateway build
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-contracts build
        working-directory: workspace

      - run: pnpm --filter longstone build
        working-directory: workspace
      - run: pnpm --filter longstone test
        working-directory: workspace
      - run: pnpm --filter longstone typecheck
        working-directory: workspace

      # Prompt files are generated from prompts/memory-discipline.md. A hand
      # edit that skips the generator is drift; fail the build instead.
      - run: node scripts/generate-prompts.mjs --check
        working-directory: workspace/longstone

  # The Copilot examples launch the PUBLISHED package through `npx`, so this
  # job needs no workspace and no pnpm install. Windows is mandatory: `npx`
  # there is `npx.cmd`, and a host that spawns it without a shell fails with
  # ENOENT rather than a useful error.
  copilot-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke-test the Copilot MCP configs against the published package
        run: node examples/copilot/smoke.mjs
